name: ci-mlflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          python-version: "3.12"

      - name: Configure MLflow conda path
        run: |
          echo "MLFLOW_CONDA_HOME=$CONDA" >> $GITHUB_ENV
          echo "$CONDA/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0

      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          mlflow run .

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: MLProject/mlruns

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub secrets are missing. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repo secrets." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build MLflow model image
        working-directory: MLProject
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          RUN_DIR=$(find mlruns -mindepth 2 -maxdepth 2 -type d -print0 | xargs -0 ls -td | head -n 1)
          RUN_ID=$(basename "$RUN_DIR")
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "$IMAGE_NAME"
          docker push "$IMAGE_NAME"
