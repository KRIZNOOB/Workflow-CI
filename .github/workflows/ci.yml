name: ci-mlflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0

      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          mlflow run .

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: MLProject/mlruns

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build MLflow model image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci:latest
        run: |
          RUN_DIR=$(find MLProject/mlruns -mindepth 2 -maxdepth 2 -type d -print0 | xargs -0 ls -td | head -n 1)
          RUN_ID=$(basename "$RUN_DIR")
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "$IMAGE_NAME"
          docker push "$IMAGE_NAME"
